<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>REBOX Translator LG</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent;color:white;font:21px Arial,Tahoma,sans-serif;overflow:hidden}
#panel{position:absolute;right:4%;top:5%;width:580px;max-width:88%;padding:25px;box-sizing:border-box;background:#0a1625f2;border:2px solid #62dfff;border-radius:18px}
h1{color:#61dfff;margin:0 0 14px;font-size:31px}p{line-height:1.45}
input{font-size:22px;padding:13px;width:100%;box-sizing:border-box;background:#101a2a;color:white;border:2px solid #577b91;border-radius:10px;direction:ltr}
button{padding:12px 17px;margin:5px 4px 5px 0;background:#2b465a;color:white;border:0;border-radius:11px;font-size:20px}
button:focus,.selected{background:#5bdbff!important;color:#081623!important}
#video{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#caption{display:none;position:absolute;top:77%;left:7%;width:86%;box-sizing:border-box;text-align:center;font-size:28pt;line-height:1.5;
font-weight:bold;white-space:pre-wrap;text-shadow:0 2px 6px #000;background:#000c;padding:9px 18px;border-radius:12px}
#status{font-size:17px;color:#9ddfff}
</style></head><body>
<video id="video" muted autoplay playsinline></video>
<div id="caption"></div>
<div id="panel">
<h1>REBOX Translator LG</h1>
<p>اكتب رابط REBOX من الآيفون على نفس الواي فاي (من دون /tv).</p>
<input id="url" placeholder="http://192.168.0.100:45678">
<button id="connect">اتصال</button>
<div id="ports"><button data-hdmi="0" class="selected">ترجمة فقط</button>
<button data-hdmi="1">HDMI 1</button><button data-hdmi="2">HDMI 2</button>
<button data-hdmi="3">HDMI 3</button><button data-hdmi="4">HDMI 4</button></div>
<button id="hide">إخفاء القائمة</button>
<p id="status">بانتظار الاتصال</p>
<p style="font-size:16px;color:#b4bfca">تجربة HDMI داخل التطبيق ليست مضمونة على كل موديلات LG. فتح التلفزيون من المتصفح وحده لا يعطي طبقة HDMI.</p>
</div>
<script>
(function(){
var input=document.getElementById('url'),panel=document.getElementById('panel'),
 status=document.getElementById('status'),caption=document.getElementById('caption'),
 video=document.getElementById('video'),url=localStorage.getItem('rebox.url')||'',timer;
input.value=url;
function clean(t){t=String(t||'').trim().replace(/\/(?:tv|state)\/?$/,'').replace(/\/+$/,'');return /^https?:\/\/[a-z0-9.-]+:\d{1,5}$/i.test(t)?t:'';}
function show(t){caption.textContent=String(t||'');caption.style.display=caption.textContent?'block':'none';}
function poll(){
 if(!url)return;
 var x=new XMLHttpRequest();x.open('GET',url+'/state?nonce='+Date.now(),true);x.timeout=2300;
 x.onload=function(){if(x.status!==200){status.textContent='فشل HTTP '+x.status;show('');return;}
 try{show(JSON.parse(x.responseText).subtitle);status.textContent='متصل بالآيفون';}
 catch(e){status.textContent='بيانات غير صالحة';}};
 x.onerror=x.ontimeout=function(){status.textContent='انقطع اتصال REBOX';show('');};x.send();
}
document.getElementById('connect').onclick=function(){
 var next=clean(input.value);if(!next){status.textContent='تأكد من رابط http://IP:PORT';return;}
 url=next;localStorage.setItem('rebox.url',url);if(timer)clearInterval(timer);
 poll();timer=setInterval(poll,900);
};
document.getElementById('ports').onclick=function(e){
 var n=Number(e.target.getAttribute('data-hdmi'));if(isNaN(n))return;
 for(var b of document.querySelectorAll('[data-hdmi]'))b.className=Number(b.getAttribute('data-hdmi'))===n?'selected':'';
 if(!n){video.pause();video.innerHTML='';video.removeAttribute('src');video.load();video.style.display='none';return;}
 video.innerHTML='';var s=document.createElement('source');s.type='service/webos-external';s.src='ext://hdmi:'+n;
 video.appendChild(s);video.style.display='block';video.load();var p=video.play();
 if(p&&p.catch)p.catch(function(){status.textContent='موديل LG قد لا يدعم تضمين HDMI';});
};
document.getElementById('hide').onclick=function(){panel.style.display='none';};
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.keyCode===13)&&panel.style.display==='none')panel.style.display='block';});
if(url)document.getElementById('connect').click();
})();
</script></body></html>
