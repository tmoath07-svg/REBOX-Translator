name: GameSub
options:
  bundleIdPrefix: com.tmoath07
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  StarfoldShared:
    path: Upstream/Packages/StarfoldShared
  StreamKit:
    path: Upstream/Packages/StreamKit
  XboxKit:
    path: Upstream/Packages/XboxKit
targets:
  GameSub:
    type: application
    platform: iOS
    dependencies:
      - package: StarfoldShared
      - package: StreamKit
      - package: XboxKit
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "GAME SUB"
        StarfoldMicrosoftClientID: "1f907974-e22b-4810-a9de-d9647380c97e"
        NSLocalNetworkUsageDescription: "GAME SUB connects to Xbox and sends translated captions to LG on your local Wi-Fi."
        NSMicrophoneUsageDescription: "The Xbox streaming engine supports optional voice features; GAME SUB does not require microphone access for subtitles."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.gamesub
        PRODUCT_NAME: GameSub
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
